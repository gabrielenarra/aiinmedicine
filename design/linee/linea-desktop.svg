<!--
  Linea narrativa — desktop. Tracciato ricavato dal file Figma (nodo 26:5, home 3:7).
  Coordinate: stesse della home del disegno (viewBox = dimensioni della home, 1440 x 8785 px).
  Geometria: curve di Bézier ricalcolate sul tracciato originale con scarto massimo inferiore a 0,5 px
  (desktop: segmenti originali). Stile: tratto 5,9 px con gradiente (lilla chiaro → viola), due ombre esterne.
  NON incluse: le due ombre interne del tratto (bianca -1,1/-1,1 e viola +1,1/+1,1): vedi design/linee/LEGGIMI-linee.md.
  Opacità: il frame del disegno che contiene la linea è al 58% (gruppo #linea-gruppo): vale anche per le sfere dentro quel frame (ancore.json, campo opacita).
  Per animare: stroke-dasharray / stroke-dashoffset sull'elemento #linea (vedi pagina Figma 06, foglio C, sequenza 4).
  Questo SVG è decorativo: aria-hidden, fuori dall'ordine di tabulazione.
-->
